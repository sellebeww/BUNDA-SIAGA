org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP mendaftarkan sumber hasil generate lewat kotlin.sourceSets, yang secara bawaan
# ditolak Kotlin bawaan AGP 9. Kode hasil generate Room membutuhkannya.
android.disallowKotlinSourceSets=false
